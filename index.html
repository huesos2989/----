<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <!-- Подключаем современный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Сброс отступов и настройка базовых стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Анимированный градиентный фон */
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #333;
            padding: 20px;
        }

        /* Анимация переливания фона */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Стеклянная карточка */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            /* Начальное состояние для анимации появления */
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease-out forwards;
        }

        /* Анимация появления карточки */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #e73c7e, #23a6d5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        /* Красивая кнопка */
        .btn {
            display: inline-block;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(45deg, #e73c7e, #23a6d5);
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(231, 60, 126, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        /* Эффект при наведении на кнопку */
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(35, 166, 213, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Адаптация под мобильные устройства */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет, мир!</h1>
        <p>Этот сайт размещён с помощью <strong>GitHub Pages</strong>.<br>Теперь он выглядит стильно и современно.</p>
        <a href="https://github.com/huesos2989" target="_blank" class="btn">Мой GitHub</a>
    </div>
</body>
</html>
