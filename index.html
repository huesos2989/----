<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё портфолио</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            /* Мягкое свечение на фоне */
            background-image: radial-gradient(circle at 20% 30%, rgba(88, 101, 242, 0.15), transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.15), transparent 40%);
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Аватар с пульсирующим свечением */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5865f2, #a855f7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            margin: 0 auto 25px;
            position: relative;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(88, 101, 242, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(88, 101, 242, 0); }
            100% { box-shadow: 0 0 0 0 rgba(88, 101, 242, 0); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #5865f2, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1rem;
            color: #888;
            font-weight: 300;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Секция навыков */
        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .skill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: default;
        }

        .skill:hover {
            background: rgba(88, 101, 242, 0.2);
            border-color: #5865f2;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.3);
        }

        /* Кнопки соцсетей */
        .socials {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-block;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            color: #e0e0e0;
            border: 2px solid #5865f2;
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            transition: color 0.4s ease;
            z-index: 1;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #5865f2, #a855f7);
            transition: width 0.4s ease;
            z-index: -1;
        }

        .social-btn:hover {
            color: #fff;
        }

        .social-btn:hover::before {
            width: 100%;
        }

        /* Адаптация под телефоны */
        @media (max-width: 500px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 1.7rem; }
            .avatar { width: 90px; height: 90px; font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">H</div>
        <h1>Лолита</h1>
        <p class="subtitle">Начинающий разработчик • GitHub Pages</p>

        <div class="skills">
            <span class="skill">HTML</span>
            <span class="skill">CSS</span>
            <span class="skill">Git</span>
            <span class="skill">Python</span>
            <span class="skill">VS Code</span>
        </div>

        <div class="socials">
            <a href="https://github.com/huesos2989" target="_blank" class="social-btn">GitHub</a>
            <a href="#" class="social-btn">Связаться</a>
        </div>
    </div>
</body>
</html>
